<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>adiker.eu — Homepage</title>
    <meta content="Adiker • Jellyfin" name="description" />
    <meta content="#0b0f14" name="theme-color" />
    <meta content="adiker.eu" property="og:title" />
    <meta content="Jellyfin access and utilities" property="og:description" />
    <meta content="website" property="og:type" />
    <link
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Ccircle cx='22' cy='22' r='8' fill='%230ea5e9'/%3E%3Cpath d='M38 18l16 14-16 14z' fill='%237cc4ff'/%3E%3C/svg%3E"
        rel="icon" />
</head>

<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div aria-hidden="true" class="logo"></div>
                <div>
                    <h1 id="title">adiker.eu</h1>
                    <div class="tag" id="subtitle" style="display:block;">My Playground</div>
                    <div class="tag" id="availability">Usually available: 9:00 AM – 1:00 AM CEST</div>
                </div>
            </div>
            <nav aria-label="Sections (placeholder)" class="tabs">
                <button aria-selected="true" class="tab" id="tab-jellyfin" type="button">Jellyfin</button>
                <button aria-selected="false" class="tab" id="tab-filebrowser" type="button">Filebrowser</button><button
                    aria-selected="false" class="tab" id="tab-more" type="button">More services (soon)</button>
            </nav>
            <div class="controls">
                <button aria-pressed="false" class="chip" id="theme-toggle" title="Toggle theme">🌙 Theme</button>
                <div aria-label="Language" class="chip" role="group">
                    <div class="lang-switch">
                        <button aria-pressed="true" class="chip" id="lang-en">EN</button>
                        <button aria-pressed="false" class="chip" id="lang-pl">PL</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="wrap">
        <main>
            <section class="card">
                <div class="j-wrap">
                    <div class="j-left">
                        <div aria-hidden="true" class="j-icon">
                            <img alt="Jellyfin logo"
                                src="https://upload.wikimedia.org/wikipedia/commons/4/41/Jellyfin_-_icon-transparent.svg" />
                        </div>
                        <div>
                            <h2 id="jf-title" style="margin:0 0 6px">🎬 Jellyfin</h2>
                            <p class="tag" id="jf-sub" style="margin:0">Your media server</p>
                            <div id="status-wrap" style="margin-top:8px">
                                <span class="pill" id="ping-pill"><span class="dot" id="ping-dot"
                                        style="background:var(--bad)"></span><span id="ping-text">Offline</span></span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <a aria-label="Open Jellyfin" class="btn" href="https://jellyfin.adiker.eu" id="jf-btn"
                            rel="noopener" target="_blank">
                            <svg aria-hidden="true" fill="none" height="18" viewbox="0 0 24 24" width="18">
                                <path d="M5 12h14M13 5l7 7-7 7" stroke="#7cc4ff" stroke-linecap="round"
                                    stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                            <span id="jf-btn-text">Open Jellyfin</span>
                        </a>
                    </div>
                </div>
            </section>
            <section class="card">
                <div class="j-wrap">
                    <div class="j-left">
                        <div aria-hidden="true" class="j-icon">
                            <img alt="Filebrowser logo"
                                src="https://raw.githubusercontent.com/filebrowser/logo/master/icon.svg" />
                        </div>
                        <div>
                            <h2 id="fb-title" style="margin:0 0 6px">📁 Filebrowser</h2>
                            <p class="tag" id="fb-sub" style="margin:0">Your file manager</p>
                            <div id="status-wrap" style="margin-top:8px">
                                <span class="pill" id="fb-pill"><span class="dot" id="fb-dot"
                                        style="background:var(--bad)"></span><span id="fb-text">Offline</span></span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <a aria-label="Open Jellyfin" class="btn" href="https://files.adiker.eu" id="fb-btn"
                            rel="noopener" target="_blank">
                            <svg aria-hidden="true" fill="none" height="18" viewbox="0 0 24 24" width="18">
                                <path d="M5 12h14M13 5l7 7-7 7" stroke="#7cc4ff" stroke-linecap="round"
                                    stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                            <span id="fb-btn-text">Open Filebrowser</span>
                        </a>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <span class="brand-year">© <span id="year"></span> adiker.eu •</span>
            <span id="served">Served by GitHub/Caddy</span> •
            <a href="https://github.com/Adiker/webserver" target="_blank" rel="noopener" class="github-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.94.58.11.79-.25.79-.56v-2.02c-3.2.7-3.87-1.38-3.87-1.38-.53-1.34-1.29-1.7-1.29-1.7-1.06-.73.08-.72.08-.72 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.72 1.27 3.38.97.1-.76.41-1.27.75-1.56-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.2-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.08 11.08 0 0 1 2.9-.39c.99 0 1.99.13 2.9.39 2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.75.81 1.2 1.83 1.2 3.09 0 4.41-2.68 5.39-5.24 5.67.42.36.8 1.08.8 2.18v3.24c0 .31.21.68.8.56A10.99 10.99 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5z" />
                </svg>
                GitHub
            </a>
        </footer>
    </div>
    <div aria-atomic="true" aria-live="polite" class="toast" id="toast"></div>
    <link href="css/styles.css" rel="stylesheet" />
    <script src="js/app.js"></script>
</body>

</html>
