name: Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run smoke checks
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f css/styles.css
          test -f js/app.js
          test -f img/505675340-c40b22c9-33da-47b7-bc4c-ce69bb5cc174.png
          test -f CNAME
          grep -qx 'adiker.eu' CNAME

          node --check js/app.js

          python3 -m http.server 18080 --bind 127.0.0.1 > /tmp/adiker-http.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..20}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" -eq 1

          curl --fail --silent http://127.0.0.1:18080/ --output /tmp/index.html
          grep -q 'css/styles.css' /tmp/index.html
          grep -q 'js/app.js' /tmp/index.html

          curl --fail --silent --output /dev/null http://127.0.0.1:18080/css/styles.css
          curl --fail --silent --output /dev/null http://127.0.0.1:18080/js/app.js
          curl --fail --silent --output /dev/null http://127.0.0.1:18080/img/505675340-c40b22c9-33da-47b7-bc4c-ce69bb5cc174.png

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site
          cp index.html CNAME _site/
          cp -R css js img _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
